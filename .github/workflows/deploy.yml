name: Deploy FalconScout 2.0

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Backend & Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # package-lock.json now records every platform's optional native binary
      # (the rolldown bindings), so a clean lockfile install resolves the right
      # one on Linux. It previously only contained the win32 binding, which is
      # why this step used to delete the lockfile and re-resolve from scratch —
      # making every deploy pull unpinned transitive versions.
      - name: Install dependencies
        run: npm ci

      # ── Step 1: Deploy Convex backend ────────────────────────────────────
      # npx convex deploy pushes schema + functions to the production deployment
      # associated with CONVEX_DEPLOY_KEY. It does NOT build the frontend.
      - name: Deploy Convex backend
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      # ── Step 2 & 3: Build + package for Vercel ───────────────────────────
      # `vercel build` runs our Vite build (npm run build) AND packages the
      # output into .vercel/output/ which is what --prebuilt expects.
      # VITE_* env vars are injected here so the built bundle points to prod.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment info
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}

      - name: Deploy to Vercel (production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
